<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analyzer — Stock & Crypto Predictions</title>
    <meta name="description" content="Calibrated BUY/SELL signals with multi-timeframe technicals, FinBERT sentiment, market context, macro regime, sector-relative scoring, and Mia — your in-app Market Intelligence Analyst.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="app-title-wrap">
                <h1 class="app-title app-title-ecg" aria-label="Market Analyzer">
                    <!-- Real ECG-style trace: SVG text with stroke (no fill), plus a
                         stroke-dasharray animation that draws every letter's outline
                         progressively from start to end. Same drawing motion as Mia's
                         logo, just applied to a whole word. -->
                    <!-- "Market Analyzer" hand-drawn as one continuous ECG polyline.
                         Each letter is a sharp zigzag of straight segments forming
                         a recognizable letter shape; flat baseline runs at y=14
                         connect adjacent letters into a single heartbeat trace.
                         Drawn-progressively-by-blip animation matches Mia's logo. -->
                    <svg class="title-ecg-svg" viewBox="0 0 460 28" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                        <path class="title-ecg-trace" d="
                            M2 14
                            L4 14 L8 4 L11 24 L14 4 L17 24 L21 4 L24 14
                            L26 14 L28 8 L30 14 L32 8 L34 14 L34 22
                            L36 14 L38 22 L40 14 L42 8 L44 14
                            L46 14 L48 22 L50 14 L52 8 L54 14
                            L56 14 L58 22 L60 14 L62 8 L64 22 L66 8 L68 14
                            L70 14 L72 22 L74 8 L76 22 L78 8 L80 22 L82 14
                            L84 14 L86 4 L88 22 L90 14 L92 4 L94 22 L96 14
                            L98 14
                            L102 14
                            L104 14 L108 4 L110 22 L113 4 L115 22 L118 4 L120 14
                            L122 14 L124 22 L126 8 L128 22 L130 8 L132 22 L134 14
                            L136 14 L138 8 L140 22 L142 14 L144 8 L146 22 L148 14
                            L150 14 L152 22 L154 8 L156 22 L158 14
                            L160 14 L162 4 L164 22 L166 14
                            L168 14 L170 22 L172 8 L174 22 L176 14
                            L178 14 L180 4 L182 14 L184 22 L186 14
                            L188 14 L190 8 L192 22 L194 8 L196 14
                            L198 14
                            L200 14
                            "
                            fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
                        <path class="title-ecg-blip" d="
                            M2 14
                            L4 14 L8 4 L11 24 L14 4 L17 24 L21 4 L24 14
                            L26 14 L28 8 L30 14 L32 8 L34 14 L34 22
                            L36 14 L38 22 L40 14 L42 8 L44 14
                            L46 14 L48 22 L50 14 L52 8 L54 14
                            L56 14 L58 22 L60 14 L62 8 L64 22 L66 8 L68 14
                            L70 14 L72 22 L74 8 L76 22 L78 8 L80 22 L82 14
                            L84 14 L86 4 L88 22 L90 14 L92 4 L94 22 L96 14
                            L98 14
                            L102 14
                            L104 14 L108 4 L110 22 L113 4 L115 22 L118 4 L120 14
                            L122 14 L124 22 L126 8 L128 22 L130 8 L132 22 L134 14
                            L136 14 L138 8 L140 22 L142 14 L144 8 L146 22 L148 14
                            L150 14 L152 22 L154 8 L156 22 L158 14
                            L160 14 L162 4 L164 22 L166 14
                            L168 14 L170 22 L172 8 L174 22 L176 14
                            L178 14 L180 4 L182 14 L184 22 L186 14
                            L188 14 L190 8 L192 22 L194 8 L196 14
                            L198 14
                            L200 14
                            "
                            fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="title-ecg-sr">Market Analyzer</span>
                </h1>
            </div>
        </div>
    </header>

    <div class="header-actions">
        <button class="header-btn" id="about-btn" title="About Market Analyzer" aria-label="About">i</button>
        <button class="header-btn" id="pl-toggle" title="Show P&L Calculator (P)" aria-label="Toggle P&L Calculator" aria-expanded="false">$</button>
        <button class="header-btn" id="currency-toggle" title="Show prices in INR" aria-label="Toggle currency"><span class="cur-from">$</span><span class="cur-arrow">→</span><span class="cur-to">₹</span></button>
        <button class="theme-toggle" id="theme-toggle" title="Switch theme">🌙</button>
    </div>

    <div class="app-layout">
        <aside class="glossary-rail" id="glossary-rail"></aside>

        <main class="main-container">
            <section class="controls-section">
                <div class="tabs-row">
                    <div class="tab-group">
                        <button class="tab-btn active" data-tab="stock">Stock Analysis</button>
                        <button class="tab-btn" data-tab="crypto">Crypto Analysis</button>
                    </div>
                    <div class="tab-group">
                        <button class="tab-btn active" data-timeframe="today">Today</button>
                        <button class="tab-btn" data-timeframe="tomorrow">Tomorrow</button>
                    </div>
                </div>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" class="search-input" placeholder="Search any global symbol — AAPL, RELIANCE.NS, 0700.HK, 7203.T..." autocomplete="off">
                    <div class="search-results" id="search-results"></div>
                </div>
            </section>

            <section class="chart-section">
                <div class="chart-header hidden" id="chart-header">
                    <span class="chart-symbol" id="chart-symbol"></span>
                    <span class="chart-price" id="chart-price"></span>
                </div>
                <div class="chart-container">
                    <div id="tradingview-widget"></div>
                </div>
            </section>

            <section class="accuracy-strip" id="accuracy-strip"></section>
            <section class="signal-section" id="signal-section"></section>

            <section class="hotpicks-section">
                <div class="section-header">
                    <h2 class="section-title" id="hotpicks-title">🔥 Hot Picks — Top 20 Global Predictions</h2>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="spikers-btn" id="spikers-btn" title="Find candidates likely to spike today">🚀 Spikers</button>
                        <button class="refresh-btn" id="refresh-hotpicks" title="Refresh hot picks (r)">↻ Refresh</button>
                    </div>
                </div>
                <div class="penny-filters" role="tablist" aria-label="Penny stock filter">
                    <button class="penny-filter-btn active" data-penny-filter="" role="tab" aria-selected="true">All prices</button>
                    <button class="penny-filter-btn" data-penny-filter="p10" role="tab" aria-selected="false">Pennies &lt; $10</button>
                    <button class="penny-filter-btn" data-penny-filter="p5" role="tab" aria-selected="false">Pennies &lt; $5</button>
                    <button class="penny-filter-btn" data-penny-filter="p1" role="tab" aria-selected="false">Sub-$1</button>
                </div>
                <div class="hotpicks-grid" id="hotpicks-grid">
                    <div class="loading" style="grid-column: 1/-1;">
                        <div class="loader"></div>
                        <span class="loading-text">Scanning global markets for hot picks...</span>
                        <span class="loading-tip" id="loading-tip"></span>
                    </div>
                </div>
            </section>
        </main>

        <aside class="pl-sidebar" id="pl-sidebar">
            <div class="pl-sidebar-header"><h3>P&amp;L Calculator</h3></div>
            <div class="pl-body">
                <div class="pl-field">
                    <label>Investment Amount</label>
                    <div class="pl-input-wrap"><span class="pl-prefix">$</span><input type="number" id="pl-investment" placeholder="0.00"></div>
                </div>
                <div class="pl-field">
                    <label>Purchase Price per Share</label>
                    <div class="pl-input-wrap"><span class="pl-prefix">$</span><input type="number" id="pl-buyPrice" placeholder="0.00"></div>
                </div>
                <div class="pl-field">
                    <label>Current / Target Price <button type="button" class="pl-use-current" id="pl-useCurrent" title="Tap: fill Current/Target Price. Long-press: fill Purchase Price.">
                        <svg class="pl-uc-ring" preserveAspectRatio="none" aria-hidden="true">
                            <rect class="pl-uc-ring-fg" x="0" y="0" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" pathLength="100"/>
                        </svg>
                        <span class="pl-uc-text">Use current</span>
                    </button></label>
                    <div class="pl-input-wrap"><span class="pl-prefix">$</span><input type="number" id="pl-currentPrice" placeholder="0.00"></div>
                </div>
                <button class="pl-btn" id="pl-calcBtn">Calculate P&amp;L</button>
                <div class="pl-error" id="pl-error"></div>
                <div class="pl-result" id="pl-result">
                    <div class="pl-result-icon" id="pl-resIcon"></div>
                    <div class="pl-result-label" id="pl-resLabel"></div>
                    <div class="pl-result-amount" id="pl-resAmount"></div>
                    <div class="pl-result-pct" id="pl-resPct"></div>
                    <div class="pl-result-details">
                        <div class="pl-detail"><span class="pl-dl">Shares</span><span class="pl-dv" id="pl-resShares">—</span></div>
                        <div class="pl-detail"><span class="pl-dl">Current Value</span><span class="pl-dv" id="pl-resValue">—</span></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <button id="mia-launcher" class="mia-launcher" title="Ask Mia—your Market Intelligence Analyst" aria-label="Open Mia chat">
        <svg class="mia-launcher-logo mia-ecg-svg" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="mia-ecg-trace" d="M2 14 L6 14 Q8 14 9 12 T11 14 L14 6 L17 16 L20 6 L23 14 Q25 14 26 12 T28 14 L32 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
            <path class="mia-ecg-blip" d="M2 14 L6 14 Q8 14 9 12 T11 14 L14 6 L17 16 L20 6 L23 14 Q25 14 26 12 T28 14 L32 14" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <div id="mia-panel" class="mia-panel" aria-hidden="true"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
