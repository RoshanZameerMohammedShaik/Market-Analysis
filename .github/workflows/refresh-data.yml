name: Refresh model data

on:
  schedule:
    # Daily backtest + penny-modules backtest at 04:00 UTC.
    - cron: '0 4 * * *'
    # Daily retrain attempt at 04:30 UTC — GATED by tools/should_retrain.py
    # which only proceeds if >=64 new resolved horizons accumulated since
    # the last retrain (or >=7 days passed). Repo is public so Actions
    # minutes are unlimited; the gate exists for signal quality, not cost.
    # Was '30 4 * * 0' (Sunday only) before the daily-conditional change.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        required: true
        default: 'backtest'
        type: choice
        options:
          - backtest
          - retrain
          - retrain_penny
          - retrain_intraday
          - penny_modules_backtest
          - both

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hard backstop: a single run must never burn hours. When Yahoo
    # rate-limits the yfinance fetch, the old loop degraded into a
    # multi-hour hang (one run took 3h17m before failing). robust_download
    # in shared_features.py now bounds per-symbol retries/throttle, and
    # THIS cap guarantees the job dies fast instead of squatting a runner
    # if throttling is severe. A healthy retrain finishes in ~20 min.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide which tasks to run
        id: decide
        run: |
          do_backtest=false
          do_retrain=false
          do_retrain_penny=false
          do_retrain_intraday=false
          do_penny_modules=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then do_backtest=true; do_penny_modules=true; fi
            # Daily retrain slot — but only actually retrain if the gate
            # says there's enough new ground truth. should_retrain.py
            # exits 0 to proceed, 1 to skip. The intraday model retrains
            # on the same gate (it's the same ground truth that moved).
            if [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
              if python tools/should_retrain.py; then
                do_retrain=true; do_retrain_penny=true; do_retrain_intraday=true
              else
                echo "Retrain gate: not enough new resolutions — skipping retrain today."
              fi
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.task }}" in
              backtest) do_backtest=true;;
              retrain) do_retrain=true;;
              retrain_penny) do_retrain_penny=true;;
              retrain_intraday) do_retrain_intraday=true;;
              penny_modules_backtest) do_penny_modules=true;;
              both) do_backtest=true; do_retrain=true;;
            esac
          fi
          echo "do_backtest=$do_backtest" >> $GITHUB_OUTPUT
          echo "do_retrain=$do_retrain" >> $GITHUB_OUTPUT
          echo "do_retrain_penny=$do_retrain_penny" >> $GITHUB_OUTPUT
          echo "do_retrain_intraday=$do_retrain_intraday" >> $GITHUB_OUTPUT
          echo "do_penny_modules=$do_penny_modules" >> $GITHUB_OUTPUT

      - name: Run backtest
        if: steps.decide.outputs.do_backtest == 'true'
        run: python backtest.py

      - name: Run penny-modules historical backtest
        if: steps.decide.outputs.do_penny_modules == 'true'
        run: python backtest_penny_modules.py

      - name: Retrain LSTM (walk-forward)
        if: steps.decide.outputs.do_retrain == 'true'
        run: python train_walkforward.py

      - name: Retrain XGBoost ensemble
        if: steps.decide.outputs.do_retrain == 'true'
        run: python train_xgboost.py

      - name: Retrain penny-tier LSTM
        if: steps.decide.outputs.do_retrain_penny == 'true'
        run: python train_penny_lstm.py

      - name: Retrain intraday (1h) LSTM
        if: steps.decide.outputs.do_retrain_intraday == 'true'
        run: python train_intraday.py

      - name: Stamp retrain marker
        # Records resolved-horizon count + timestamp so tomorrow's
        # should_retrain.py measures NEW resolutions from this point.
        # Only runs when a retrain actually happened.
        if: steps.decide.outputs.do_retrain == 'true'
        run: python tools/mark_retrain.py

      - name: Commit refreshed artifacts
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Add the model/ directory; missing files don't error out under -A.
          if [ -d model ]; then
            git add -fA model/
          fi
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          msg="chore(data): auto-refresh"
          if [ "${{ steps.decide.outputs.do_backtest }}" = "true" ]; then msg="$msg backtest"; fi
          if [ "${{ steps.decide.outputs.do_penny_modules }}" = "true" ]; then msg="$msg pennyback"; fi
          if [ "${{ steps.decide.outputs.do_retrain }}" = "true" ]; then msg="$msg retrain"; fi
          if [ "${{ steps.decide.outputs.do_retrain_penny }}" = "true" ]; then msg="$msg penny"; fi
          if [ "${{ steps.decide.outputs.do_retrain_intraday }}" = "true" ]; then msg="$msg intraday"; fi
          msg="$msg [skip actions]"
          git status --short
          git commit -m "$msg"
          # Same retry logic as live-ledger: cron jobs can race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done
          echo "All push attempts exhausted."
          exit 1
