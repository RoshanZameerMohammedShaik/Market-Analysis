name: Feature extractor sync check

on:
  pull_request:
    paths:
      - 'js/ai-model.js'
      - 'shared_features.py'
      - 'train_model.py'
      - '.github/workflows/live-ledger.yml'
      - 'tools/workflow_task_coverage.py'
      - 'js/forecast-band.js'
      - 'tools/band_sync_check.py'
      - 'tools/band_sync_check.mjs'
      - 'tools/calibrate_bands.py'
      - 'model/band_calibration.json'
      - 'js/risk.js'
      - 'tools/risk_check.mjs'
      - 'record_outcomes.py'
      - 'tools/resolver_check.py'
      - 'price_round.py'
      - 'js/price-round.js'
      - 'tools/price_round_check.py'
      - 'forecast_band.py'
      - 'record_predictions.py'
      - 'js/analysis.js'
      - 'ai_infer.py'
      - 'js/ai-model.js'
      - 'js/xgb-model.js'
      - 'tools/ai_sync_check.py'
      - 'tools/ai_sync_check.mjs'
      - 'model/lstm_weights.json'
      - 'model/xgb_trees.json'
      - 'tools/skill_report.py'
  push:
    branches: [main]
    paths:
      - 'js/ai-model.js'
      - 'shared_features.py'
      - 'train_model.py'
      - '.github/workflows/live-ledger.yml'
      - 'tools/workflow_task_coverage.py'
      - 'js/forecast-band.js'
      - 'tools/band_sync_check.py'
      - 'tools/band_sync_check.mjs'
      - 'tools/calibrate_bands.py'
      - 'model/band_calibration.json'
      - 'js/risk.js'
      - 'tools/risk_check.mjs'
      - 'record_outcomes.py'
      - 'tools/resolver_check.py'
      - 'price_round.py'
      - 'js/price-round.js'
      - 'tools/price_round_check.py'
      - 'forecast_band.py'
      - 'record_predictions.py'
      - 'js/analysis.js'
      - 'ai_infer.py'
      - 'js/ai-model.js'
      - 'js/xgb-model.js'
      - 'tools/ai_sync_check.py'
      - 'tools/ai_sync_check.mjs'
      - 'model/lstm_weights.json'
      - 'model/xgb_trees.json'
      - 'tools/skill_report.py'

# Why this exists: js/ai-model.js and shared_features.py both compute the
# 8-feature vector that feeds the LSTM. If they ever drift (the vol_ratio
# bug from the original PR was exactly this), predictions degrade silently.
# This job runs both extractors against synthetic OHLCV and asserts the
# numbers match to 6 decimal places.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # Match the version these harnesses are actually developed and verified
          # against. The gap was a real hazard, not housekeeping: ai_sync_check failed on
          # the runner while passing six consecutive times locally, and Node was one of
          # three environment axes differing at once (Node 20 vs 24, Python 3.11 vs 3.13,
          # numpy pinned vs latest). GitHub also now force-runs Node-20 actions on 24 and
          # annotates the deprecation, so 20 was already not what was executing.
          node-version: '24'
      - run: pip install numpy pyyaml
      - name: Run sync check
        run: python tools/feature_sync_check.py

  # Live ledger task routing. The cron dispatches work by task name, and those
  # names are substrings of each other, so a contains() condition can silently
  # run a region twice or route a task to nothing at all. That failure mode
  # cost LSE + XETRA two months of data with no signal but a failure email.
  ledger-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install pyyaml
      - name: Check Live ledger task routing
        run: python tools/workflow_task_coverage.py

  # The browser draws the High/Low bands the user sees; the cron scores them for
  # calibration. If the two implementations drift, the displayed confidence stops
  # describing the displayed band, which is the exact failure this feature
  # replaced. Deterministic synthetic fixtures, so no network needed in CI.
  band-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          # Match the version these harnesses are actually developed and verified
          # against. The gap was a real hazard, not housekeeping: ai_sync_check failed on
          # the runner while passing six consecutive times locally, and Node was one of
          # three environment axes differing at once (Node 20 vs 24, Python 3.11 vs 3.13,
          # numpy pinned vs latest). GitHub also now force-runs Node-20 actions on 24 and
          # annotates the deprecation, so 20 was already not what was executing.
          node-version: '24'
      # numpy is needed by ai_infer.py (the LSTM forward pass). Deliberately NOT
      # torch: the runner should not pull a 900 MB dependency to multiply a
      # 32-unit hidden state, and the exported weights are plain JSON.
      - run: pip install numpy
      - name: Check band math parity (JS vs Python)
        run: python tools/band_sync_check.py
      # Risk code is not verified by matching numbers to a fixture. A sizing bug
      # does not throw, it quietly oversizes and surfaces as a drawdown months
      # later, so these assert the properties that must never break.
      - name: Check risk invariants
        run: node tools/risk_check.mjs
      # Guards the worst defect this project has had: outcomes graded against
      # another row's price window. Synthetic bars, so no network needed.
      - name: Check outcome resolver anchoring
        run: python tools/resolver_check.py
      # Every stored entry price, price target and band edge goes through this
      # pair. round(entry_price, 4) stored SHIB-USD as literally 0.0, which made
      # every sub-penny row permanently ungradable while the app kept issuing
      # calls on them. Asserts properties, not just fixture equality: a fixture
      # test passes happily on fixed precision for any symbol above a dollar.
      - name: Check price rounding parity and non-collapse
        run: python tools/price_round_check.py
      # The cron now runs the LSTM to fill the ledger's `ai` breakdown while the
      # browser runs it to show the user a score. Two implementations of one
      # number: if they drift, the ledger records one AI opinion and the user is
      # shown another, and the skill attributed to the AI source stops describing
      # what is on screen. Exercises the DEPLOYED weights, so it also catches the
      # input_size mismatch if the model is ever retrained at 11 features.
      - name: Check AI inference parity (JS vs Python)
        run: python tools/ai_sync_check.py
