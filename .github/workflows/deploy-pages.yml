name: Deploy to Cloudflare Pages

# WHY THIS EXISTS
# ---------------
# market-ai.pages.dev had stopped deploying entirely. Every path on it returned the same stale
# 32,711-byte index.html, which is Cloudflare's SPA fallback answering for files that were never
# uploaded -- js, css and every model artifact included. That matters more than a mirror going
# stale, because two things point at that hostname specifically:
#
#   * capacitor.config.ts loads https://market-ai.pages.dev on every launch of the Android app,
#     so the APK has been serving a weeks-old build.
#   * The Yahoo proxy Worker origin-locks /stock-quote to market-ai.pages.dev (+ localhost).
#     github.io is NOT in that allowlist, so that endpoint is dead on the GitHub Pages mirror.
#
# DIRECT UPLOAD, NOT THE GIT INTEGRATION
# --------------------------------------
# Deliberately `wrangler pages deploy` rather than reconnecting Cloudflare's Git build. The Git
# integration builds on EVERY push, and this repo's crons push constantly -- the ledger writes ~8
# times a day and the desk loop once committed 25 times in one day, which is what exhausted the
# free plan's 500 builds/month in the first place. Direct upload puts the trigger under our
# control, and the triggers below are chosen to stay far under the cap:
#
#   push (code paths only)  -- a few a day at most, and a code change must ship immediately
#   schedule every 6h       -- 4/day, picks up recent.json / macro.json / timeline.json
#   workflow_dispatch       -- manual
#
# That is roughly 120-160 deploys a month against a 500 ceiling, with headroom for a busy day.
# Data files are NOT push-triggered on purpose: recent.json alone is rewritten 8x/day and would
# otherwise account for 240 deploys a month on its own.

on:
  push:
    branches: [main]
    paths:
      # Code and styling: ship on the next push, because a fix nobody can see is not shipped.
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '_headers'
      - 'ui-preview.html'
      - 'css/**'
      - 'js/**'
      - 'dev/**'
      # Model artifacts that change rarely and change BEHAVIOUR when they do.
      - 'model/lstm_weights.json'
      - 'model/lstm_weights_penny.json'
      - 'model/lstm_weights_intraday.json'
      - 'model/xgb_trees.json'
      - 'model/band_calibration.json'
      - 'model/live_calibration.json'
      - 'model/backtest_results.json'
      # The bundler itself, so a change to what ships actually ships.
      - 'tools/build_pages_dist.mjs'
      - '.github/workflows/deploy-pages.yml'

  # Picks up the cron-written data (ledger slice, macro series, desk timeline) without letting
  # every one of those commits trigger its own deploy.
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual deploy
        required: false
        default: manual sync

# One deploy at a time. Two concurrent uploads to the same Pages project race over which becomes
# the live deployment, and the loser silently wins nothing. cancel-in-progress is TRUE here (unlike
# the ledger cron) because an in-flight deploy of older files has no value once newer ones exist.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  # SKIP CLEANLY WHEN UNCONFIGURED, DO NOT FAIL.
  #
  # The first version failed the run when the secrets were absent, on the reasoning that a green
  # run which uploaded nothing is worse than a red one. That reasoning was right about silence and
  # wrong about the mechanism: the schedule fires every 6 hours, so it produced four failure emails
  # a day for a state that is simply "not set up yet" and needs no action beyond the one already
  # requested. Failure notifications that arrive on a known, expected condition train you to ignore
  # the ones that matter.
  #
  # So: absent credentials SKIP the deploy with a notice in the run summary, visible in the Actions
  # tab and silent in your inbox. The moment the secrets exist, the next 6-hourly run picks them up
  # and deploys with no further intervention. A deploy that is ATTEMPTED and fails still goes red,
  # which is the case worth an email.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Are the Cloudflare credentials configured?
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credentials present; deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deploy skipped"
              echo
              echo "\`CLOUDFLARE_API_TOKEN\` and/or \`CLOUDFLARE_ACCOUNT_ID\` are not set, so there is"
              echo "nothing to authenticate with. This is a setup state, not a failure."
              echo
              echo "To enable: **Settings -> Secrets and variables -> Actions**"
              echo "- \`CLOUDFLARE_API_TOKEN\` - dash.cloudflare.com -> My Profile -> API Tokens,"
              echo "  permission **Account / Cloudflare Pages / Edit**"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\` - the id in the dashboard URL after \`/accounts/\`"
              echo
              echo "The next scheduled run (every 6h) will deploy automatically once both exist."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. Not a failure -- see the run summary for the two secrets to add."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails loudly when a required model artifact is absent or a file exceeds Cloudflare's
      # 25 MiB per-file ceiling, so a broken bundle never reaches the edge. The four ledger
      # shards (29-40 MB each) are excluded by design; the browser reads the recent.json slice.
      - name: Build the deployable bundle
        run: node tools/build_pages_dist.mjs

      - name: Show what is about to ship
        run: |
          echo "files: $(find dist -type f | wc -l)"
          echo "bytes: $(du -sb dist | cut -f1)"
          test -f dist/index.html || { echo "::error::no dist/index.html"; exit 1; }
          test -f dist/model/ledger/recent.json || echo "::warning::recent.json absent from bundle"

      # SELF-DIAGNOSING, because "wrangler could not authenticate" has two completely different
      # causes that look identical from the outside, and the run log is not readable without a
      # GitHub token so I cannot inspect it for you.
      #
      #   1. The token lacks Account / Cloudflare Pages / Edit.
      #   2. CLOUDFLARE_ACCOUNT_ID is not an account id. The Account ID and a Zone ID are BOTH
      #      32-character hex strings and sit on different dashboard pages, so pasting the zone id
      #      is the single easiest mistake to make here.
      #
      # Cloudflare's own API separates them: /user/tokens/verify says whether the token is valid at
      # all, and /accounts lists the accounts it can reach. Comparing that list to the configured id
      # answers which of the two it is, as a fact rather than a guess. Nothing here echoes the
      # token -- the responses describe it, and account ids are identifiers, not credentials.
      - name: Diagnose the credentials before using them
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # SHAPE CHECK FIRST, because Cloudflare's rejection is a bare "code 1000: Invalid API
          # Token" that does not say WHY, and the three plausible values are visually similar:
          #
          #   API Token      ~40 chars, mixed case with - and _   <- the correct one
          #   Global API Key  37 chars, lowercase hex             <- different auth scheme entirely;
          #                                                         needs X-Auth-Key/X-Auth-Email,
          #                                                         so Bearer always gives code 1000
          #   Account ID      32 chars, lowercase hex             <- an identifier, not a credential
          #
          # The Global API Key sits further down the SAME dashboard page as the token creator, which
          # makes it the easiest wrong thing to copy. Naming the shape turns an opaque rejection into
          # an instruction.
          if printf '%s' "$TOKEN" | grep -qE '^[0-9a-f]{37}$'; then
            echo "::error title=that is a Global API Key, not an API Token::The secret is 37 lowercase hex characters, which is the shape of Cloudflare's Global API Key. That key uses a different auth scheme (X-Auth-Key + X-Auth-Email) and can never work as a Bearer token. Create an API TOKEN instead: dash.cloudflare.com > My Profile > API Tokens > Create Token > Create Custom Token, permission Account / Cloudflare Pages / Edit. Do not use the API Keys section lower down that page."
            exit 1
          fi
          if printf '%s' "$TOKEN" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error title=that looks like an ID, not a token::The secret is 32 lowercase hex characters, which is the shape of a Cloudflare Account ID or Zone ID rather than an API token. CLOUDFLARE_API_TOKEN needs the ~40-character token string from My Profile > API Tokens > Create Custom Token."
            exit 1
          fi
          if [ "${#TOKEN}" -lt 30 ]; then
            echo "::error title=token looks truncated::CLOUDFLARE_API_TOKEN is only ${#TOKEN} characters; a Cloudflare API token is around 40. It was probably copied incompletely."
            exit 1
          fi

          echo "--- is the token itself valid? ---"
          v=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          echo "$v" | head -c 600; echo
          if ! echo "$v" | grep -q '"success":true'; then
            echo "::error title=token rejected::Cloudflare returned code 1000 (Invalid API Token) for a value that is the right shape, so it is wrong rather than mistyped -- most likely revoked, expired, or copied with surrounding whitespace. Create a fresh one at dash.cloudflare.com > My Profile > API Tokens > Create Token > Create Custom Token with the single permission Account / Cloudflare Pages / Edit, and paste it with no leading or trailing spaces."
            exit 1
          fi

          echo "--- which accounts can this token reach? ---"
          a=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          ids=$(echo "$a" | grep -o '"id":"[0-9a-f]\{32\}"' | cut -d'"' -f4 | sort -u)
          if [ -z "$ids" ]; then
            echo "The token is valid but can see NO accounts."
            echo "$a" | head -c 600; echo
            echo "::error title=token has no account scope::The token authenticates but grants no account-level access, so it cannot touch Pages. Recreate it with permission Account / Cloudflare Pages / Edit (an account-scoped permission, not a zone one)."
            exit 1
          fi
          echo "$ids" | while read -r i; do echo "  account visible to token: ${i:0:6}...${i: -4}"; done
          echo "  CLOUDFLARE_ACCOUNT_ID  : ${ACCOUNT:0:6}...${ACCOUNT: -4}  (len ${#ACCOUNT})"
          if ! echo "$ids" | grep -qx "$ACCOUNT"; then
            echo "::error title=account id mismatch::CLOUDFLARE_ACCOUNT_ID is not one of the accounts this token can reach. The likeliest cause is that it holds a ZONE id: both are 32-hex and look alike. The ACCOUNT id is on dash.cloudflare.com right after the domain in the URL, and in the right-hand panel of Workers & Pages. Update the secret to one of the ids listed above."
            exit 1
          fi
          echo "token and account id agree."

      # The project name is INFERRED from the hostname (market-ai.pages.dev -> "market-ai"). If that
      # guess is wrong, wrangler fails with an error that does not name the actual problem, and the
      # fix -- setting the CLOUDFLARE_PAGES_PROJECT repo variable -- is not discoverable from it. So
      # list the real projects and print them first, which turns a name mismatch into an obvious
      # diff in the log. It also tells two very different failures apart: a token that cannot list
      # anything (wrong permission or wrong account id) versus a good token pointed at a name that
      # does not exist, where the deploy would CREATE a second site nobody is looking at.
      - name: Confirm the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'market-ai' }}
        run: |
          echo "looking for project: $PROJECT"
          if ! npx --yes wrangler@4 pages project list > /tmp/projects.txt 2>&1; then
            echo "::error title=Cloudflare auth failed::wrangler could not list Pages projects. The token most likely lacks the 'Account / Cloudflare Pages / Edit' permission, or CLOUDFLARE_ACCOUNT_ID is wrong."
            sed -n '1,25p' /tmp/projects.txt
            exit 1
          fi
          cat /tmp/projects.txt
          if ! grep -qw "$PROJECT" /tmp/projects.txt; then
            echo "::warning title=project not found::No Pages project named '$PROJECT'. The deploy below will CREATE it. If your real project has a different name, set the repo variable CLOUDFLARE_PAGES_PROJECT to that name (Settings > Secrets and variables > Actions > Variables) so this updates the existing site instead of publishing a second one."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Overridable so a renamed project does not need a code change.
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'market-ai' }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-dirty=true

      # Proves the deploy actually took, by asking for a file that the SPA fallback would answer
      # for if it had not. Content-type is the tell: a missing file comes back as text/html.
      - name: Verify the edge is serving real files
        run: |
          sleep 20
          fail=0
          for f in js/app.js css/style.css model/macro.json model/ledger/recent.json; do
            ct=$(curl -s -o /dev/null -w '%{content_type}' "https://market-ai.pages.dev/$f" --max-time 40)
            case "$f" in
              *.js)   want=javascript ;;
              *.css)  want=css ;;
              *.json) want=json ;;
            esac
            if echo "$ct" | grep -qi "$want"; then
              echo "  OK   $f -> $ct"
            else
              echo "  FAIL $f -> $ct (expected $want; text/html means the file is not deployed)"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "::error::the edge is still answering with the SPA fallback for real files"; exit 1; }
