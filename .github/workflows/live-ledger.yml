name: Live ledger

# Per-region open-of-day prediction crons + nightly outcome resolution
# + nightly calibration recompute. Each region is timed roughly to the
# market's open in UTC. UTC means we don't track DST exactly — close
# enough; ledger framing is "first price seen on the trading day".
#
# Crypto is 24/7 so we just snapshot once at 00:00 UTC.

on:
  schedule:
    # NYSE — opens 13:30 UTC (winter) / 14:30 UTC (summer DST)
    - cron: '35 13 * * 1-5'
    # LSE / DAX — opens 08:00 UTC (winter) / 07:00 UTC (summer DST)
    - cron: '5 8 * * 1-5'
    # NSE (India) — opens 03:45 UTC year-round
    - cron: '50 3 * * 1-5'
    # HKEX — opens 01:30 UTC
    - cron: '35 1 * * 1-5'
    # TYO — opens 00:00 UTC
    - cron: '5 0 * * 1-5'
    # ASX — opens 23:00 UTC (Sun-Thu)
    - cron: '5 23 * * 0-4'
    # Crypto — fixed UTC snapshot
    - cron: '0 0 * * *'
    # Outcome resolution + calibration recompute — daily at 22:00 UTC
    # (after NYSE close, before the next region opens)
    - cron: '0 22 * * *'

  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        required: true
        default: 'predict-NYSE'
        type: choice
        # Every value here must be handled by a step condition below, and the
        # cron task names in "Decide task" must appear here too, otherwise the
        # slot cannot be replayed by hand. predict-LSE-XETRA was missing, so
        # the one cron that was failing was also the one nobody could
        # manually re-run. resolve-and-recalibrate is the cron's name for the
        # nightly job; resolve-outcomes and recalibrate stay as the
        # finer-grained manual halves.
        options:
          - predict-NYSE
          - predict-CRYPTO
          - predict-NSE
          - predict-LSE
          - predict-XETRA
          - predict-LSE-XETRA
          - predict-HKEX
          - predict-TYO
          - predict-ASX
          - resolve-and-recalibrate
          - resolve-outcomes
          - recalibrate
          # Destructive: rebuilds every matured horizon (~67,000 rows). Manual
          # only, never on a cron. See the step for why it has to exist.
          - reresolve-outcomes

jobs:
  ledger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide task
        id: decide
        run: |
          set -e
          task=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            task="${{ github.event.inputs.task }}"
          else
            case "${{ github.event.schedule }}" in
              "35 13 * * 1-5")  task="predict-NYSE"   ;;
              "5 8 * * 1-5")    task="predict-LSE-XETRA" ;;
              "50 3 * * 1-5")   task="predict-NSE"    ;;
              "35 1 * * 1-5")   task="predict-HKEX"   ;;
              "5 0 * * 1-5")    task="predict-TYO"    ;;
              "5 23 * * 0-4")   task="predict-ASX"    ;;
              "0 0 * * *")      task="predict-CRYPTO" ;;
              "0 22 * * *")     task="resolve-and-recalibrate" ;;
            esac
          fi
          if [ -z "$task" ]; then
            echo "ERROR: no task matched. event_name='${{ github.event_name }}' schedule='${{ github.event.schedule }}' input='${{ github.event.inputs.task }}'"
            exit 1
          fi
          echo "Resolved task: $task"
          echo "task=$task" >> $GITHUB_OUTPUT

      # Task conditions are EXACT equality, never contains(). The task name
      # 'predict-LSE-XETRA' contains the substring 'predict-LSE', so a
      # contains() test made the standalone LSE step fire on the combined
      # run. LSE was predicted twice per run, and the second (intended) leg
      # then found every symbol already written and hard-failed, which
      # skipped the commit step and threw away that run's LSE + XETRA rows.
      # LSE and XETRA wrote nothing from 2026-06-19 to 2026-08-18 because of
      # this. Keep these exact.
      - name: Predict NYSE
        if: steps.decide.outputs.task == 'predict-NYSE'
        run: python record_predictions.py --region NYSE

      - name: Predict CRYPTO
        if: steps.decide.outputs.task == 'predict-CRYPTO'
        run: python record_predictions.py --region CRYPTO

      - name: Predict NSE
        if: steps.decide.outputs.task == 'predict-NSE'
        run: python record_predictions.py --region NSE

      - name: Predict LSE
        if: steps.decide.outputs.task == 'predict-LSE'
        run: python record_predictions.py --region LSE

      - name: Predict XETRA
        if: steps.decide.outputs.task == 'predict-XETRA' || steps.decide.outputs.task == 'predict-LSE-XETRA'
        run: python record_predictions.py --region XETRA

      - name: Predict LSE (combined run)
        if: steps.decide.outputs.task == 'predict-LSE-XETRA'
        # Pause between the XETRA and LSE legs so Yahoo isn't hit with the
        # second region's full batch while still throttling the first. The
        # back-to-back call was the dominant cause of the LSE leg getting a
        # near-100% empty-df response and tripping the region's hard-fail
        # guard. Combined with the fetch-layer retry/backoff in
        # record_predictions.py, this keeps the combined run green on
        # transient throttling while still failing red on a real Yahoo outage.
        run: |
          sleep 30
          python record_predictions.py --region LSE

      - name: Predict HKEX
        if: steps.decide.outputs.task == 'predict-HKEX'
        run: python record_predictions.py --region HKEX

      - name: Predict TYO
        if: steps.decide.outputs.task == 'predict-TYO'
        run: python record_predictions.py --region TYO

      - name: Predict ASX
        if: steps.decide.outputs.task == 'predict-ASX'
        run: python record_predictions.py --region ASX

      # The cron sends 'resolve-and-recalibrate' (both halves); the manual
      # dispatch can also send either half on its own. Exact-matching each
      # accepted value keeps the manual options working, which a bare
      # == 'resolve-and-recalibrate' would have silently broken.
      - name: Resolve outcomes
        if: steps.decide.outputs.task == 'resolve-and-recalibrate' || steps.decide.outputs.task == 'resolve-outcomes'
        run: python record_outcomes.py

      # Rebuilds EVERY matured horizon from scratch instead of only the null ones.
      # Needed because outcomes written by the old positional resolver are frozen:
      # the normal path skips any horizon that already holds a value, so a wrong
      # value never self-corrects.
      #
      # Deliberately a separate manual-only task, never reachable from a cron.
      # It rewrites roughly 67,000 rows in one pass, and the run is the only copy
      # of that history, so it should be launched knowingly and its diff reviewed.
      # Until now --reresolve existed as a flag with NO way to invoke it: the
      # nightly job never passes it and the repo needs yfinance to run it locally,
      # so the fix shipped in the resolver had no path to reach the stored data.
      - name: Re-resolve ALL outcomes (destructive rebuild)
        if: steps.decide.outputs.task == 'reresolve-outcomes'
        run: python record_outcomes.py --reresolve

      - name: Recalibrate
        if: steps.decide.outputs.task == 'resolve-and-recalibrate' || steps.decide.outputs.task == 'recalibrate'
        run: python recalibrate_from_ledger.py

      # The browser reads this ~1.7 MB slice instead of the 85 MB year file.
      # Without it, readTodayLock() falls back to a page-visit-time lock and the
      # day's call stops being anchored on the market open.
      - name: Write recent ledger slice for the browser
        if: always()
        run: python tools/write_recent_slice.py --days 3

      # always() so a failing leg of a multi-region run doesn't discard the
      # rows the successful legs already wrote to disk. The job still reports
      # red (the failed step decides the conclusion). We just stop throwing
      # away good data on the way out.
      - name: Inspect what's on disk after the script
        if: always()
        run: |
          echo "Working directory: $(pwd)"
          echo "Tree under model/:"
          ls -la model/ 2>&1 || true
          if [ -d model/ledger ]; then
            echo "Tree under model/ledger/:"
            ls -la model/ledger/ 2>&1
            echo "Line counts per file:"
            wc -l model/ledger/*.jsonl 2>&1 || true
          else
            echo "model/ledger/ directory does NOT exist after the script ran."
          fi

      - name: Commit ledger updates
        if: always() && steps.decide.outputs.task != ''
        env:
          TASK: ${{ steps.decide.outputs.task }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -d model/ledger ]; then
            git add -fA model/ledger/
          fi
          if [ -f model/ledger/recent.json ]; then
            git add -f model/ledger/recent.json
          fi
          if [ -f model/live_calibration.json ]; then
            git add -f model/live_calibration.json
          fi
          if git diff --cached --quiet; then
            echo 'No staged changes to commit.'
            exit 0
          fi
          git status --short
          git commit -m "chore(ledger): $TASK [skip ci]"

          # Push with retry. If the push is rejected because origin moved,
          # we try `rebase origin/main` first — for clean append-only changes
          # this almost always succeeds. But the prior assumption that JSONL
          # is purely append-only was wrong: record_outcomes.py REWRITES
          # rows in place (filling matured horizon outcomes), so a predict-*
          # cron landing concurrently with a resolve cron will hit a real
          # 3-way merge conflict.
          #
          # Recovery strategy when rebase conflicts: hard-reset to origin
          # (drop our local commit cleanly) and re-run the original task —
          # all task scripts are idempotent (record_predictions skips
          # already-predicted-today rows; record_outcomes rewrites the file
          # deterministically; recalibrate regenerates from the ledger).
          # This is cheaper and more correct than trying to merge JSONL by
          # hand inside a workflow.

          run_task() {
            case "$TASK" in
              predict-NYSE)        python record_predictions.py --region NYSE   ;;
              predict-CRYPTO)      python record_predictions.py --region CRYPTO ;;
              predict-NSE)         python record_predictions.py --region NSE    ;;
              predict-LSE)         python record_predictions.py --region LSE    ;;
              predict-XETRA)       python record_predictions.py --region XETRA  ;;
              predict-LSE-XETRA)   python record_predictions.py --region XETRA && sleep 30 && python record_predictions.py --region LSE ;;
              predict-HKEX)        python record_predictions.py --region HKEX   ;;
              predict-TYO)         python record_predictions.py --region TYO    ;;
              predict-ASX)         python record_predictions.py --region ASX    ;;
              resolve-and-recalibrate)
                python record_outcomes.py
                python recalibrate_from_ledger.py
                ;;
              # These three were MISSING, so a push rejection on any of them fell
              # through to "Unknown TASK" and the recovery re-run failed. The
              # nightly cron only ever sends resolve-and-recalibrate, which is why
              # it went unnoticed: it broke exactly the manually-dispatched halves,
              # and only when a concurrent push forced a retry.
              # tools/workflow_task_coverage.py now asserts this stays complete.
              resolve-outcomes)    python record_outcomes.py ;;
              recalibrate)         python recalibrate_from_ledger.py ;;
              reresolve-outcomes)  python record_outcomes.py --reresolve ;;
              *) echo "Unknown TASK: $TASK"; return 1 ;;
            esac
          }

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected; pulling origin/main..."
            git fetch origin main
            if git rebase origin/main; then
              echo "Rebase clean on attempt $attempt; pushing again."
              sleep $((attempt * 2))
              continue
            fi

            echo "Rebase had a content conflict. Aborting rebase, hard-resetting to origin/main, and re-running task."
            git rebase --abort || true
            git reset --hard origin/main
            run_task
            git add -fA model/ledger/ || true
            if [ -f model/live_calibration.json ]; then
              git add -f model/live_calibration.json
            fi
            if git diff --cached --quiet; then
              echo 'After re-run, nothing new to commit (idempotent path won).'
              exit 0
            fi
            git status --short
            git commit -m "chore(ledger): $TASK [skip ci]"
            sleep $((attempt * 2))
          done
          echo "All push attempts exhausted."
          exit 1
