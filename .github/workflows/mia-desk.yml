name: Mia 2.0 desk

# Mia's paper-trading desk. She decides, sizes and fills; the timeline in the Portfolio
# panel is the product.
#
# WHY HOURLY
# ----------
# Roshan asked for a bot that "stays active 24/7". A cron is the only way to get that
# without his laptop being the compute, which he has ruled out. Hourly is the honest
# compromise:
#
#   * Crypto never closes, so every run has at least one live market and the session gate
#     in bot/sessions.py decides the rest. Stocks are only traded inside their own venue
#     hours, which is what he asked for.
#   * The engine's call is LOCKED once per day at the market open, so decisions do not
#     improve with more frequent polling. What does need frequent checking is the
#     take-profit / stop-loss on open positions, and that is the real argument for running
#     between signals rather than once a day.
#   * Actions minutes are free on public repos, so the run itself costs nothing. The
#     metered resource is Cloudflare Pages builds, handled in the commit step below.
#
# It is NOT continuous, and the timeline says so: every run appends to runs.jsonl with the
# gap since the previous one, so a delayed or skipped cron is visible in the UI instead of
# looking like a quiet market. Actions routinely delays scheduled runs by 10-30 minutes
# and drops them entirely under load; pretending otherwise would make the P/L record look
# more deliberate than it is.

on:
  schedule:
    # On the hour. Deliberately offset from every Live ledger cron (:00 vs :05/:35/:50)
    # so the two workflows are unlikely to be pushing at the same moment.
    # Every FIVE hours, and each job then trades in a loop for ~4h50m. Overlapping
    # long-lived jobs, not hourly one-shots.
    #
    # Hourly cron was the wrong shape twice over. Actions delivered it every 2-3 hours in
    # practice -- 00:00 and 01:00 were skipped outright and 03:00 never fired at all -- so
    # the advertised cadence was fiction. And a cron cannot go below 5 minutes anyway, which
    # is nowhere near "watch the position". Doing the waiting INSIDE the job costs one cron
    # delivery per five hours instead of 24, and the loop's own pacing is then reliable.
    #
    # 5h spacing against a ~4h50m runtime gives continuous cover with margin, and the
    # concurrency group below serialises any overlap rather than doubling up.
    - cron: '0 */5 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        required: true
        default: 'trade'
        type: choice
        options:
          # START HERE. Arms the desk with the allocation in `allocationUSD` below and
          # opens the book. Until this is run once, every scheduled run exits immediately
          # having done nothing: allocating capital is Roshan's decision, not a side
          # effect of the workflow existing. It self-seeded $25,000 and executed 11 fills
          # the first time round purely because the cron landed on main, which is exactly
          # the behaviour this mode exists to prevent.
          - arm
          # Stops trading. Positions and history are kept, so it is reversible.
          - disarm
          - trade
          # Decides and prints, writes nothing. The safe way to see what she WOULD do.
          - dry-run
          # Destructive: deletes state, trades and runs, back to a fresh seed. The whole
          # point of the desk is an unbroken record of decisions, so this throws away the
          # only copy of it. Manual only, never reachable from the cron.
          - reset
      allocationUSD:
        description: 'For mode=arm only: how much of your portfolio to hand the desk, in USD'
        required: false
        default: ''
      positions:
        description: 'For mode=arm only: how many stocks she may hold at once, per strategy (1 = one name at a time)'
        required: false
        default: '3'

# Mia gets her OWN group rather than sharing 'live-ledger'.
#
# Sharing looked tidier and is wrong: GitHub keeps at most ONE pending run per group and
# CANCELS any earlier pending one. With an hourly bot and eight daily ledger crons, bot
# runs would routinely be cancelled while waiting behind a ledger run. Separate groups let
# both proceed; they touch disjoint paths (model/bot/ vs model/ledger/) so a concurrent
# push rebases cleanly.
#
# cancel-in-progress: false because a run that has already filled an order must be allowed
# to commit it. Cancelling mid-flight would leave the account state and the timeline
# disagreeing about what happened.
# TRADING runs serialise against each other. CONTROL actions must not queue behind them.
#
# One shared group was fine when this was an hourly one-shot. Once the job became a 4h50m
# loop it broke every control action: a dispatched arm/disarm/reset sat `pending` for hours
# waiting for the trading job to finish, so the UI showed "her job is running" forever and
# nothing was cleared. Worse, GitHub keeps only ONE pending run per group, so clicking twice
# CANCELLED the first attempt -- run #16 was cancelled by #17 for exactly this reason.
#
# Splitting on the mode means arm/disarm/reset start immediately. Safety against a reset
# racing a live trading loop is handled in the loop itself, which re-reads the config every
# cycle and exits as soon as the desk is no longer armed.
concurrency:
  group: mia-desk-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'trade') && 'control' || 'trade' }}
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    # Actions hard-kills a job at 6h. The loop stops itself at 4h50m; this is the backstop
    # if that arithmetic is ever wrong, and it must stay comfortably under 360.
    timeout-minutes: 320
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # bot/advise.mjs imports the app's REAL engine (js/confidence.js, js/ai-model.js)
      # rather than reimplementing it, so the desk needs Node as well as Python. Pinned to
      # the same major the parity harnesses are developed against: a version skew here was
      # already one wasted debugging session on ai_sync_check.
      # NODE AND PIP ARE ONLY FOR TRADING.
      #
      # arm / disarm / reset are a few lines of stdlib Python that rewrite a JSON file and
      # delete some others. They were paying ~60s of `pip install -r requirements.txt` plus a
      # Node toolchain install before doing 0.2s of work, which is most of the reason Clear &
      # reset felt like it was hanging. Skipping both takes a control action from ~90s to ~15s.
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'trade' || steps.mode.outputs.mode == 'dry-run'
        with:
          node-version: '24'

      - name: Install Python deps (trading only)
        if: steps.mode.outputs.mode == 'trade' || steps.mode.outputs.mode == 'dry-run'
        run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          set -e
          mode="trade"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          fi
          echo "Mode: $mode"
          echo "mode=$mode" >> $GITHUB_OUTPUT

      # Exact equality, never contains(). 'dry-run' does not contain 'trade' and vice
      # versa here, but the Live ledger workflow lost two months of LSE and XETRA rows to
      # exactly this shortcut ('predict-LSE-XETRA' contains 'predict-LSE'), so the pattern
      # is banned in this repo regardless of whether today's values happen to be safe.
      # Arm/disarm run BEFORE the trading step so a single dispatch can arm and then let
      # the next scheduled run trade. They are exact-equality guarded like everything else
      # in this repo.
      - name: Arm the desk with an allocation
        if: steps.mode.outputs.mode == 'arm'
        run: |
          set -e
          alloc="${{ github.event.inputs.allocationUSD }}"
          if [ -z "$alloc" ]; then
            echo "::error title=No allocation::mode=arm needs allocationUSD. Re-run and enter how much of your portfolio the desk should trade."
            exit 1
          fi
          pos="${{ github.event.inputs.positions }}"
          if [ -n "$pos" ]; then
            python -m bot.run --arm "$alloc" --positions "$pos"
          else
            python -m bot.run --arm "$alloc"
          fi

      - name: Disarm the desk
        if: steps.mode.outputs.mode == 'disarm'
        run: python -m bot.run --disarm

      # THE TRADING LOOP.
      #
      # One cycle = scan every tradeable name in the open markets, decide, execute. A cycle
      # currently measures ~21s for 41 crypto names and would be ~2min for the full 264 when
      # equities are open too, so the pace is set by the scan rather than by the sleep.
      #
      # Commits happen ONLY when trades.jsonl actually grew, i.e. when she filled something.
      # Committing every cycle would be ~100 commits per job for a file whose only change is
      # a timestamp, and each one is a candidate Cloudflare Pages build against a 500/month
      # budget shared with the ledger. Fills are capped at 8/day by the risk rails, so this
      # is bounded by design.
      #
      # SELL intents are deliberately NOT subject to the daily trade cap in approve(), so
      # stop-loss and take-profit keep firing every cycle even after the entry budget is
      # spent. That is the actual value of running continuously: entries do not improve with
      # polling, but exits do.
      - name: Trade in a loop
        id: desk
        if: steps.mode.outputs.mode == 'trade'
        env:
          # Optional. bot/advise.mjs returns an empty decision list and a note when the key
          # is absent, and the LSTM/engine sleeves keep trading, so the desk degrades to
          # three working strategies instead of failing. Sent as an x-goog-api-key HEADER,
          # never a query string, so it cannot land in a URL log.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          END=$(( $(date +%s) + 17400 ))   # 4h50m
          # 15 MINUTES, not 90 seconds.
          #
          # 90s was sized for a desk that traded on daily signals with a 90-MINUTE hold. The
          # rails are now minHoldDays 20 and maxTradesPerDay 2, so a 90-second cycle achieves
          # nothing it could act on: entries are capped at 2 a day and an exit on a 20-day
          # hold does not care about 90 seconds versus 15 minutes.
          #
          # What it DID achieve was 10x the load. Each cycle re-analyses ~400 tradeable names,
          # and every name costs Yahoo fetches and (until this commit) Cloudflare Worker
          # requests. Cutting the cadence 10x cuts all of it 10x for no loss of function.
          MIN_CYCLE=900                    # floor between cycle STARTS, seconds
          cycles=0; commits=0; last_pub_hour=""

          # Existence checked BEFORE the redirect: `wc -l < missing 2>/dev/null` still
          # prints "No such file or directory", because the shell reports the failed
          # redirection itself and 2>/dev/null only silences wc. On a fresh desk that is one
          # spurious error line per cycle, ~200 per job.
          fills_now() {
            if [ -f model/bot/trades.jsonl ]; then wc -l < model/bot/trades.jsonl; else echo 0; fi
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            started=$(date +%s)
            cycles=$(( cycles + 1 ))
            before=$(fills_now)

            # `|| true` is load-bearing. A single bad cycle -- a throttled quote feed, a
            # transient Yahoo empty response -- must not end a 5-hour job and leave the desk
            # unattended with open positions. The next cycle retries in 90 seconds.
            python -m bot.run || echo "cycle $cycles failed; continuing"

            # STOP if the desk was disarmed or reset while this loop was mid-flight.
            # Without this the loop would keep going for hours and, worse, keep committing
            # its own stale model/bot/ state -- rebasing it back on top of the reset and
            # silently undoing it. bot/run.py re-reads the config every cycle so it already
            # refuses to TRADE, but the loop also has to stop pushing.
            git fetch -q origin main 2>/dev/null || true
            if ! git show origin/main:model/bot/config.json 2>/dev/null \
                 | grep -q '"armed": true'; then
              echo "Desk is no longer armed (disarmed or reset elsewhere). Stopping the loop."
              break
            fi

            after=$(fills_now)
            if [ "$after" != "$before" ]; then
              python tools/write_bot_slice.py || true
              git add -A model/bot/ || true
              if ! git diff --cached --quiet; then
                # Publish on a fill: this is real news and worth a deploy.
                # PAGES BUILD BUDGET. This line used to be an unconditional
                # "[skip actions]", which lets Cloudflare Pages build -- so EVERY fill
                # triggered a deploy. 35 fills in a day produced 25 Pages builds against a
                # 500/month free allowance (~16/day) shared with the Live ledger, and the
                # limit-reached emails followed. The budget logic existed in the end-of-job
                # commit step and I failed to carry it into this loop when I rewrote the
                # hourly one-shot as a long-running job.
                #
                #   [skip actions]  GitHub skips, Pages BUILDS   -> publish
                #   [skip ci]       both skip                    -> commit only
                #
                # State is committed either way, so nothing is ever lost by not publishing;
                # only the live site waits. Publishing at 01/07/13/19 UTC caps the desk at
                # 4 builds a day no matter how much she trades, and the once-per-hour guard
                # stops several fills in the same hour each asking for their own build.
                hour=$(date -u +%-H)
                if [ $(( (hour + 5) % 6 )) -eq 0 ] && [ "$hour" != "$last_pub_hour" ]; then
                  token="[skip actions]"; last_pub_hour="$hour"
                  echo "Publish window ${hour}:00 UTC: Pages will build."
                else
                  token="[skip ci]"
                fi
                git commit -q -m "chore(bot): $(( after - before )) fill(s) $token"
                for a in 1 2 3; do
                  if git push -q; then commits=$(( commits + 1 )); break; fi
                  git fetch -q origin main && git rebase -q origin/main || {
                    git rebase --abort 2>/dev/null || true
                    git reset -q --hard origin/main
                    break
                  }
                done
              fi
            fi

            elapsed=$(( $(date +%s) - started ))
            nap=$(( MIN_CYCLE - elapsed ))
            [ "$nap" -gt 0 ] && sleep "$nap"
          done
          echo "Loop finished: $cycles cycles, $commits commit(s)."
          echo "cycles=$cycles" >> "$GITHUB_OUTPUT"

      - name: Dry run (decide, write nothing)
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.run --dry-run

      - name: Reset the account (destructive)
        if: steps.mode.outputs.mode == 'reset'
        run: python -m bot.run --reset

      # Rebuild the browser slice even when the desk step failed. A failed run still
      # appended its runs.jsonl row, and that row is how the UI shows something went wrong
      # instead of showing a stale-but-healthy-looking panel.
      - name: Write the browser timeline slice
        if: always() && steps.mode.outputs.mode != 'dry-run'
        run: python tools/write_bot_slice.py

      - name: What is on disk
        if: always() && steps.mode.outputs.mode != 'dry-run'
        run: |
          ls -la model/bot/ 2>&1 || echo "model/bot/ does not exist"
          wc -l model/bot/*.jsonl 2>&1 || true

      # always() so a failure in the middle of the desk step does not discard the fills it
      # had already booked. The job still reports red -- the failed step decides the
      # conclusion. This only stops good data dying with the runner, which is precisely how
      # 2026-08-27's NYSE ledger rows were permanently lost.
      - name: Commit the desk state
        if: always() && steps.mode.outputs.mode != 'dry-run'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # NO -f here, unlike the Live ledger's commit step. -f force-adds IGNORED files,
          # and .gitignore deliberately excludes model/bot/_* -- the request/advice handoff
          # between bot/run.py and bot/advise.mjs. _advice.json alone is ~86 KB and is
          # rewritten every run, so force-adding it would commit it hourly: roughly 62 MB of
          # repo growth a month, for a scratch file that is regenerated before it is ever
          # read. The ledger needs -f because some of its tracked paths are ignored; nothing
          # authoritative under model/bot/ is.
          git add -A model/bot/ || true
          if git diff --cached --quiet; then
            echo 'Nothing changed; not committing.'
            exit 0
          fi
          git status --short

          # PAGES BUILD BUDGET.
          #
          # Cloudflare Pages allows 500 builds/month on the free plan. The Live ledger
          # already spends ~240 (about 8 pushes a day). An hourly desk would add up to 720
          # and blow the budget, after which NOTHING deploys -- including the ledger.
          #
          # So the desk commits every hour (state must persist; a lost hour of decisions
          # cannot be reconstructed) but only asks for a DEPLOY four times a day, at 01,
          # 07, 13 and 19 UTC. That is ~120/month, for ~360 total, leaving real headroom.
          #
          # The two tokens are NOT interchangeable:
          #   [skip actions]  GitHub skips; Cloudflare Pages still builds  -> publish
          #   [skip ci]       BOTH skip                                    -> no publish
          # Getting this backwards is what left the live site 592 commits and 11 weeks
          # stale while every local check passed.
          hour=$(date -u +%-H)
          if [ $(( (hour + 5) % 6 )) -eq 0 ]; then
            token='[skip actions]'
            echo "Publish window (${hour}:00 UTC): Pages will build."
          else
            token='[skip ci]'
            echo "Non-publish hour (${hour}:00 UTC): committing without a Pages build."
          fi
          git commit -m "chore(bot): desk run $token"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push $attempt rejected; rebasing onto origin/main..."
            git fetch origin main
            if git rebase origin/main; then
              sleep $((attempt * 3))
              continue
            fi
            # A conflict here means something else rewrote model/bot/, which should be
            # impossible given the concurrency group. Drop this cycle rather than re-running
            # the desk: a re-run would make FRESH decisions at a new timestamp and could
            # double-book fills the first attempt had already committed. Losing one hour of
            # a paper desk is harmless; a duplicated trade corrupts the P/L record that is
            # the entire point of this workflow.
            git rebase --abort || true
            git reset --hard origin/main
            echo "::warning title=Desk cycle skipped::Rebase conflict in model/bot/. This cycle's decisions were discarded rather than risk double-booking. The next hourly run continues from origin/main."
            exit 0
          done
          echo "::warning title=Desk push failed::Could not push after 3 attempts. Next run will retry; no data is lost because the desk is deterministic from state.json."
          exit 1
